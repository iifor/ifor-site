# 本地开发用的 PostgreSQL，只绑定本机。线上请换成你自己的数据库连接串。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ifor
      POSTGRES_PASSWORD: ifor
      POSTGRES_DB: ifor
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - ifor-pg:/var/lib/postgresql/data

volumes:
  ifor-pg:
